[main]
font="Maple Mono Normal NF CN:size=13"
width=30
border-radius=10




[colors]
# 背景：深灰近黑 (暗色主题)
background=0D0D0DFF

# 输入文字：中灰色，暗背景下清晰可读
input=ADADADFF

# 默认列表文字：中灰色
text=ADADADFF

# 搜索匹配字符：亮青色高亮
match=2EFFCEFF

# 选中项背景：比背景略亮的灰色，产生凸起感
selection=3B3B3BFF

# 选中项文字：接近白色，高对比
selection-text=F2F2F2FF
selection-match=2EFFCEFF
