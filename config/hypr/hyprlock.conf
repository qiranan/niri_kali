# 变量定义，方便统一修改颜色
$grey_accent = rgba(128, 128, 128, 0.5)
$dark_grey = rgba(30, 30, 30, 0.8)

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = /usr/share/backgrounds/user/__Main__.png

    # 毛玻璃核心配置
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7
    vignette = 0.1
    vignette_darkness = 0.3
    color = rgba(25, 25, 25, 1.0)
}

# 时间显示（可选，增加完整感）
label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 64
    font_family = Maple Mono Normal NF CN
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true

    # 灰色调毛玻璃输入框
    outer_color = rgba(100, 100, 100, 0.5)
    inner_color = rgba(40, 40, 40, 0.4)
    font_color = rgb(200, 200, 200)

    fade_on_empty = false
    rounding = -1
    placeholder_text = <span foreground="##c0c0c0">输入密码...</span>
    hide_input = false

    check_color = rgb(bd93f9)
    fail_color = rgb(ff5555)

    position = 0, -20
    halign = center
    valign = center
}
