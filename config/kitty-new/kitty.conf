# ═══════════════════════════════════════════════════════════════════════════════
#  kitty 配置 —— 按 dotfiles-master 的 Ghostty 配置逐项移植
#
#  来源: dotfiles-master/dot_config/ghostty/config
#
#  为什么是「移植」而不是直接用 ghostty:
#    ghostty 官方 release 只提供 macOS 二进制 (Ghostty.dmg) 与源码 tarball,
#    **没有 Linux 预编译包**; Kali 仓库里也没有 (apt-cache search ghostty 无结果),
#    系统亦无 flatpak / snap。要装只能自备 Zig 编译器从源码构建 ——
#    在这台 4 核 Broadwell 笔记本上代价很大, 且 ghostty 对 Zig 版本有硬性要求。
#    因此保留已有的 kitty, 把外观与操作逐项对齐。
#
#  下面每条都标了对应的 ghostty 原项, 对照表另见 README「终端样式」章节。
# ═══════════════════════════════════════════════════════════════════════════════

# ── 字体 ──────────────────────────────────────────────────────────────────────
# ← font-family = JetBrainsMono Nerd Font
# ← font-size = 12
#    已装 nerd-fonts v3.4.0 版 (→ ~/.local/share/fonts/JetBrainsMonoNF/, 16 个 ttf,
#    fc-match "JetBrainsMono Nerd Font" 正确命中, 不再回退到 Noto)。
#    ⚠️ 该字体**不含中文字形**: 汉字会回退到 fontconfig 选中的 Noto Sans CJK,
#       即一行里中英文是两个不同字体。若想风格统一, 再补一行即可 (kitty 按顺序
#       回退, 只对主字体缺的字形生效, 不影响英文):
#           font_family Maple Mono Normal NF CN
font_family JetBrainsMono Nerd Font
font_size 12.0

# ← font-feature = calt  /  font-feature = liga
#    这两条**在 kitty 里不需要写**, 依据是 kitty 0.48.2 源码:
#      · calt —— kitty 对每个字体无条件开启, 见 fonts.c:491
#                memcpy(... &hb_features[CALT_FEATURE] ...), 写不写效果一样。
#                JetBrains Mono 的连字正是放在 calt 里, 所以连字默认就生效。
#      · liga —— 该字体**没有 liga 表**。用 fontTools 查其 GSUB 特性为:
#                aalt calt case ccmp cv01-cv20 cv99 frac locl ordn sinf
#                ss01 ss02 ss19 ss20 subs sups zero
#                没有 liga, 写了纯属空操作, 故省略。
#    日后再加特性务必注意: font_features 按 **PostScript 名精确匹配**
#    (fonts.c:450 `strcmp(e->psname, psname) == 0`, 不是前缀匹配), 本字体
#    的名字形如 JetBrainsMonoNF-Regular / -Bold / -Italic / -BoldItalic,
#    所以得逐面写, 例如:  font_features JetBrainsMonoNF-Regular +zero

# ── 窗口与内边距 ──────────────────────────────────────────────────────────────
# ← window-padding-x = 16 / window-padding-y = 16 / window-padding-balance = true
#    kitty 的 window_padding_width 四边等宽, 天然等价于 balance = true
window_padding_width 16
# ← window-decoration = true
hide_window_decorations no

# ── 背景与透明度 ──────────────────────────────────────────────────────────────
# ⚠️ 原 ghostty 配置**没有**设透明度 (里面的 window-padding-color = background
#    只是「内边距区域取背景色」, 跟透明度无关), 所以严格照搬的话终端是不透明的。
#    这里按需求开启半透明 —— 属于对本仓库移植基线的一处有意偏离。
#
# **模糊不用在 kitty 里设**: niri 的 config.kdl 已有一条覆盖全部窗口的规则
#     window-rule { match app-id=".*"  background-effect { blur true } }
# 所有窗口本来就带模糊, 只是背景不透明时看不见 —— 把背景调透, 模糊自然露出来。
background_opacity 0.8

# 允许用快捷键实时调透明度。不开这个的话, 下面这些 kitty 内置绑定是**失效**的:
#     ctrl+shift+a 然后 m  →  更不透明 (+0.1)
#     ctrl+shift+a 然后 l  →  更透明   (-0.1)
#     ctrl+shift+a 然后 1  →  恢复完全不透明
#     ctrl+shift+a 然后 d  →  恢复配置里的值 (即上面的 0.8)
# 注意 ctrl+shift+a 是「前缀键」(man page 里写作 ctrl+shift+a>m), 要按两下。
dynamic_background_opacity yes

# 备选: kitty 自己也能请求模糊, 走 Wayland 的 ext_background_effect_v1
#    background_blur 20
# 但 niri 的窗口规则已经强制开了 blur, 这里再加是多余的, 故不启用。
# 若哪天把 niri 那条规则删了, 再打开这行即可。

# ── 滚动 ──────────────────────────────────────────────────────────────────────
# ← scrollback-limit = 10000
scrollback_lines 10000
# ← scrollbar = system
#    kitty 没有 system 这个取值 (只有 scrolled / always / never / hovered /
#    scrolled-and-hovered), scrolled 最接近 GTK 覆盖式滚动条的手感
scrollbar scrolled

# ── 光标 ──────────────────────────────────────────────────────────────────────
# ← cursor-style = bar
#    kitty 里「竖线」光标叫 beam, 不是 bar
cursor_shape beam
# ← cursor-style-blink = true
#    kitty 该选项默认 -1 (跟随系统/由程序决定), 给正值才是强制闪烁
cursor_blink_interval 0.5
# ← custom-shader = shaders/cursor.frag  (液态光标拖尾)
#    该着色器用了 Ghostty 专有 uniform: iPreviousCursor / iCurrentCursor /
#    iCurrentCursorColor / iTimeCursorChange。kitty 的着色器 API 没有这些,
#    且无法从上一帧光标位置取数, 所以「拖尾」这件事**无法按原样移植**。
#    改用 kitty 原生 cursor_trail 实现相近观感:
#      cursor_trail = 光标在同一位置静止多少毫秒后才触发拖尾 (0 = 关闭)
#      动画速度由 cursor_trail_decay 控制, 保持默认 "0.1 0.4"
#      触发距离由 cursor_trail_start_threshold 控制, 保持默认 2 格
cursor_trail 500

# ── 鼠标 ──────────────────────────────────────────────────────────────────────
# ← mouse-hide-while-typing = true
#    kitty 用负值实现同一语义: 一打字就立刻隐藏指针
mouse_hide_wait -1.0

# ── 复制粘贴 ──────────────────────────────────────────────────────────────────
# ← copy-on-select = true
copy_on_select clipboard

# ← keybind = ctrl+c=copy_to_clipboard
#    原配置注释: "Smart Ctrl+C: selection -> copy, no selection -> cancel task / SIGINT"
#    ⚠️ 这里**必须**用 copy_or_interrupt, 不能照抄成 copy_to_clipboard ——
#       后者会把 Ctrl+C 的中断功能彻底废掉, 终端里再也发不出 SIGINT。
#       kitty 的 copy_or_interrupt 语义与原配置完全一致: 有选中就复制,
#       没选中就放行给程序 (即 Ctrl+C 中断)。
map ctrl+c copy_or_interrupt

# ← keybind = ctrl+v=paste_from_clipboard
map ctrl+v paste_from_clipboard

# ctrl+shift+c / ctrl+shift+v 是 kitty 的默认绑定, 与 ghostty 一致, 无需声明

# ← keybind = ctrl+0=reset_font_size
map ctrl+0 reset_font_size

# ── 配色 ──────────────────────────────────────────────────────────────────────
# ← config-file = theme
#    原 theme 文件由 morandi-gen.py 依据壁纸主色自动生成, 会随后续换壁纸变化。
#    kitty 这里接同一套机制: morandi-gen.py 会写出 ~/.config/kitty/morandi.conf。
#    若该文件缺失, kitty 会警告但照常启动 (下面的默认色仍可用)。
include morandi.conf
